<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Пульт диспетчера</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 21.2 8v8L12 21.2 2.8 16V8Z"/><path d="m5.5 14.5 4-4 3 2.3 5.8-5.1M15.5 7.7h2.8v2.8"/><circle cx="5.5" cy="14.5" r=".75"/></g></symbol>
      <symbol id="i-rail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 10h12M8 21l2-4m6 4-2-4M9 14h.01M15 14h.01"/></g></symbol>
      <symbol id="i-road" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12v11H3V6Zm12 4h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></g></symbol>
      <symbol id="i-sea" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 13 9-3 9 3-3 5H6l-3-5Zm4-2V6h10v5m-5-1V3M3 21c2 0 3-1 4.5-1s3 1 4.5 1 3-1 4.5-1 2.5 1 4.5 1"/></g></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></g></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></g></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></g></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></g></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/><path d="m9 12 2 2 4-4"/></g></symbol>
    </defs>
  </svg>

  <div id="gate" class="gate" hidden>
    <svg class="gate-logo"><use href="#i-logo"/></svg>
    <h1>Каспийский диспетчер</h1>
    <p id="gate-text">Откройте через бота</p>
    <p class="muted" id="gate-hint">Пульт работает внутри Telegram: кнопка «Пульт» в меню чата с ботом.</p>
  </div>

  <div id="app" class="app" hidden>
    <header class="top">
      <span class="logo"><svg><use href="#i-logo"/></svg></span>
      <div class="brand">
        <div class="brand-name">Каспийский диспетчер</div>
        <div class="brand-company" id="company"></div>
      </div>
      <span class="live" id="live" title="Обновление данных"></span>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="overview" role="tab"><svg><use href="#i-home"/></svg><span>Обзор</span></button>
      <button class="tab" data-tab="shipments" role="tab"><svg><use href="#i-box"/></svg><span>Грузы</span></button>
      <button class="tab" data-tab="decisions" role="tab"><svg><use href="#i-bolt"/></svg><span>Решения</span><i class="dot" id="tab-dot" hidden></i></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
